<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Ayudante</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.formulario{
    background:white;
    width:500px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#dc2626;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#b91c1c;
}

</style>
</head>

<body>

<div class="formulario">

<h1>Registro de Ayudante</h1>

<form>

<label>Nombre Completo</label>
<input type="text" required>

<label>Correo Institucional</label>
<input type="email" required>

<label>Carrera</label>
<input type="text" required>

<label>Semestre</label>
<input type="number" required>

<label>Asignatura que desea impartir</label>
<input type="text" required>

<label>Promedio de la asignatura</label>
<input type="number" min="1" max="7" step="0.1" required>

<label>Motivación para ser ayudante</label>
<textarea rows="4" required></textarea>

<label>
<input type="checkbox" required>
Declaro que cumplo los requisitos académicos.
</label>

<button type="submit">
Enviar Solicitud
</button>

</form>

</div>

</body>
</html>
